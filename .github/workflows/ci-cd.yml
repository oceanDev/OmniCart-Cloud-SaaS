name: OmniCart Cloud CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Automated Tests (CI)
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 3. Restore Dependencies
        run: dotnet restore src/OmniCart.sln

      - name: 4. Build Solution
        run: dotnet build src/OmniCart.sln --no-restore --configuration Release

      - name: 5. Execute Automated Tests
        run: dotnet test src/OmniCart.sln --no-build --configuration Release --verbosity normal

  # -------------------------------------------------------------
  # Job 2: Build Docker Image (CD Verification)
  # -------------------------------------------------------------
  build-docker:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Build Docker Image (Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: omnicart-api:latest

  # -------------------------------------------------------------
  # Job 3: Automated CD (Continuous Deployment to Live Server)
  # -------------------------------------------------------------
  deploy-to-vps:
    name: Deploy to Live Server
    needs: build-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: SSH into Live Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/admin/OmniCart-Cloud-SaaS || cd ~/OmniCart-Cloud-SaaS
            git pull origin main
            docker-compose pull || true
            docker-compose up -d --build --remove-orphans
            docker image prune -f

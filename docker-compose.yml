version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL with pgvector (AI-Ready Relational Database)
  # -------------------------------------------------------------
  
  omnicart-db:
    image: pgvector/pgvector:pg16
    container_name: omnicart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: OmniCartDb
      POSTGRES_USER: omnicart_user
      POSTGRES_PASSWORD: jewel@123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - omnicart-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicart_user -d OmniCartDb"]
      interval: 5s
      timeout: 5s
      retries: 5



  # -------------------------------------------------------------
  # 2. Redis (Distributed Caching & High-Performance State Store)
  # -------------------------------------------------------------
  omnicart-redis:
    image: redis:7-alpine
    container_name: omnicart_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass RedisSecret123!
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - omnicart-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "RedisSecret123!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. RabbitMQ (Event-Driven Messaging & MassTransit Bus)
  # -------------------------------------------------------------
  omnicart-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: omnicart_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP Protocol for .NET API MassTransit
      - "15672:15672"  # Management Web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - omnicart-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 4. PgAdmin (Visual Database Management UI)
  # -------------------------------------------------------------
  omnicart-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: omnicart_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@omnicart.com
      PGADMIN_DEFAULT_PASSWORD: AdminPassword123!
    ports:
      - "5050:80"      # Open http://localhost:5050 in browser
    depends_on:
      - omnicart-db
    networks:
      - omnicart-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  omnicart-network:
    driver: bridge
